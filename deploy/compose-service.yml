# Paste this service into /root/familyoffice/docker-compose.yml on the VPS,
# at the same level as `app:`, `caddy:` and `gamerelay:`. It joins the same
# network automatically, so the front Caddy can reach it as `crm:80`.
#
#   crm:
#     build: /root/crm
#     restart: unless-stopped
#
# No volumes are needed yet: the preview keeps its data in each browser.
# When the real backend lands, this service gains a data volume and an
# env_file exactly like `app:` has.
